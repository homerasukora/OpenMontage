name = "m-redactor-bot"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
OWNER_ID = "726625635"
CHANNEL_ID = "-1005659106771"
MODEL = "@cf/qwen/qwen3.8-27b"
PREMIUM_EMOJI = "off"
PLAN_STATUS = "on"   # after publishing, set STATUS = Posted in the content plan

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "DRAFTS"
id = "d4f4766ead4d4a8eb6c90a955a9a7aad"

[observability]
enabled = true

# reaction counters under channel posts (one Durable Object per message, SQLite storage)
[[durable_objects.bindings]]
name = "REACTIONS"
class_name = "Reactions"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Reactions"]
